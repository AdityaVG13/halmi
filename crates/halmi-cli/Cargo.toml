halmi-python = { path = "../halmi-python" }
halmi-script = { path = "../halmi-script" }
halmi-swift = { path = "../halmi-swift" }
halmi-zig = { path = "../halmi-zig" }
halmi-c = { path = "../halmi-c" }
halmi-cpp = { path = "../halmi-cpp" }
halmi-java = { path = "../halmi-java" }
halmi-cs = { path = "../halmi-cs" }
halmi-kotlin = { path = "../halmi-kotlin" }
halmi-php = { path = "../halmi-php" }
halmi-ruby = { path = "../halmi-ruby" }
halmi-lua = { path = "../halmi-lua" }
halmi-rs = { path = "../halmi-rs" }

[dev-dependencies]
serde_json = { workspace = true } # test-only JSON validation
tempfile = { workspace = true }
